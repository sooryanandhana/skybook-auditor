# Render Blueprint for the Skybook AI Website Auditor.
#
# ONE always-on Docker web service. The app keeps its audit jobs in an in-memory
# Map, so it must never run more than a single instance, and the instance must
# not sleep while an audit is in flight. On the free plan Render sleeps a service
# after inactivity; the frontend's polling keeps it awake during an active audit,
# but the first request after idle pays a cold start.
#
# Secrets are marked `sync: false`: Render does NOT read their values from this
# file (which is committed) — you set them once in the dashboard. Only non-secret
# operational settings carry values here.
services:
  - type: web
    name: skybook-audit
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    numInstances: 1
    # A public 200 route, so the health check never trips the auth guard.
    healthCheckPath: /login
    # No preDeployCommand: it is a paid-plan feature, and this service stays on
    # the free plan. The migration runs instead as the first thing the container
    # does on startup (see the Dockerfile CMD): it brings the schema up to date
    # before the server starts, and a failed migration exits the container non-
    # zero so the previous version keeps serving. Migrations are idempotent, so
    # the re-run on every restart (including waking from free-plan sleep) is safe.
    envVars:
      # --- secrets: set these in the Render dashboard ---
      # The user-accounts database. Create a Render PostgreSQL instance and paste
      # its Internal Connection String here, or wire it automatically with a
      # `databases:` block plus `fromDatabase`. The migration step needs it too.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SKYBOOK_EMAIL
        sync: false
      - key: SKYBOOK_PASSWORD_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SKYBOOK_MAIL_FROM
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      # --- operational, non-secret ---
      # Render sends traffic through Cloudflare: trust its CF-Connecting-IP
      # header so rate limiting keys on the client IP. X-Forwarded-For is never
      # read (Cloudflare appends to a client-sent one). On the onrender.com
      # hostname a client-supplied CF-Connecting-IP was observed to be refused
      # by Cloudflare (403, error code 1000); Render does not guarantee this,
      # and any other hostname should be checked the same way.
      - key: SKYBOOK_TRUST_PROXY
        value: "1"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
