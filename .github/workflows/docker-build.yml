name: Docker build check

# Runs on every push to the feature branch. Pushes to master do not trigger it,
# and pushing this branch does not trigger Render (Render deploys master only).
on:
  push:
    branches:
      - local/dashboard-and-fixes
  workflow_dispatch: # manual button; GitHub shows it only once this file is on master

# The automatic token may read the repository and nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels an older run that is still going.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build production image (no push, no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # do not leave the token on disk

      - name: Show Docker version
        run: docker version

      - name: Build the image from the existing Dockerfile
        # Unchanged Dockerfile, node:22-bookworm-slim base, committed lockfile.
        # No registry login, no --push, no build secrets, no build arguments.
        run: docker build --pull --progress=plain --tag skybook-audit:ci .

      - name: Inspect the built image (offline; the app is never started)
        # --network none: none of these checks can reach the internet.
        run: |
          docker image ls skybook-audit:ci

          echo "--- Node in the image must be 22.x ---"
          docker run --rm --network none --entrypoint node skybook-audit:ci \
            -e "const v = process.versions.node; console.log('Node ' + v); process.exit(v.startsWith('22.') ? 0 : 1)"

          echo "--- Chromium installed where Puppeteer expects it (not launched) ---"
          docker run --rm --network none --entrypoint sh skybook-audit:ci -c \
            'test -x /usr/bin/chromium && dpkg-query -W -f="chromium \${Version}\n" chromium'

          echo "--- Files the start command needs; no .env baked in ---"
          docker run --rm --network none --entrypoint sh skybook-audit:ci -c '
            set -e
            cd /app
            test -f server.js
            test -d .next/static
            test -d public
            test -f lib/db/migrate.cli.mts
            node -e "process.exit(require(\"./package.json\").scripts.migrate ? 0 : 1)"
            test ! -e .env
            test ! -e .env.local
            echo "image layout OK"'
